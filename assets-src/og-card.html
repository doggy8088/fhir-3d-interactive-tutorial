<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <title>FHIR 3D social card source</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600;700&family=JetBrains+Mono:wght@400;500&family=Noto+Sans+TC:wght@400;500;700;900&display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        position: relative;
        width: 1200px;
        height: 630px;
        overflow: hidden;
        background: #04070d;
        color: #e8f4f8;
        font-family: "Noto Sans TC", "PingFang TC", sans-serif;
      }
      .grid {
        position: absolute;
        inset: 0;
        background-image: linear-gradient(rgba(80, 160, 190, 0.08) 1px, transparent 1px),
          linear-gradient(90deg, rgba(80, 160, 190, 0.08) 1px, transparent 1px);
        background-size: 44px 44px;
        mask-image: radial-gradient(ellipse 88% 78% at 34% 4%, black 26%, transparent 74%);
        -webkit-mask-image: radial-gradient(ellipse 88% 78% at 34% 4%, black 26%, transparent 74%);
      }
      .halo {
        position: absolute;
        right: -220px;
        top: -240px;
        width: 900px;
        height: 900px;
        background: radial-gradient(circle, rgba(34, 211, 238, 0.2), rgba(34, 211, 238, 0) 60%);
      }
      .halo-2 {
        position: absolute;
        left: -160px;
        bottom: -300px;
        width: 780px;
        height: 780px;
        background: radial-gradient(circle, rgba(245, 165, 36, 0.12), rgba(245, 165, 36, 0) 62%);
      }
      .frame {
        position: absolute;
        inset: 26px;
        border: 1px solid rgba(120, 190, 220, 0.16);
        border-radius: 22px;
      }
      .content {
        position: relative;
        height: 100%;
        padding: 74px 0 66px 78px;
        display: flex;
        flex-direction: column;
      }
      .eyebrow {
        font-family: "JetBrains Mono", monospace;
        font-size: 17px;
        letter-spacing: 0.34em;
        text-transform: uppercase;
        color: #22d3ee;
      }
      h1 {
        margin-top: 22px;
        font-family: "Chakra Petch", "Noto Sans TC", sans-serif;
        font-size: 168px;
        line-height: 0.86;
        font-weight: 700;
        letter-spacing: -0.02em;
        color: #f2fdff;
        text-shadow: 0 0 44px rgba(34, 211, 238, 0.55);
      }
      .subtitle {
        margin-top: 10px;
        font-size: 42px;
        font-weight: 900;
        letter-spacing: 0.01em;
        color: #e8f4f8;
      }
      .rule {
        margin-top: 30px;
        width: 232px;
        height: 2px;
        background: linear-gradient(90deg, rgba(34, 211, 238, 0.9), rgba(34, 211, 238, 0));
      }
      .lede {
        margin-top: 26px;
        max-width: 620px;
        font-size: 23px;
        line-height: 1.72;
        color: #9fbdcc;
      }
      .chips {
        margin-top: auto;
        display: flex;
        gap: 12px;
      }
      .chip {
        padding: 11px 20px;
        border: 1px solid rgba(120, 190, 220, 0.24);
        border-radius: 999px;
        background: rgba(13, 24, 38, 0.7);
        font-family: "JetBrains Mono", monospace;
        font-size: 18px;
        color: #bfe6f2;
      }
      .url {
        margin-top: 22px;
        font-family: "JetBrains Mono", monospace;
        font-size: 19px;
        letter-spacing: 0.06em;
        color: #6f93a6;
      }
      .art {
        position: absolute;
        right: 62px;
        top: 96px;
      }
    </style>
  </head>
  <body>
    <div class="grid"></div>
    <div class="halo"></div>
    <div class="halo-2"></div>
    <div class="frame"></div>

    <svg class="art" width="430" height="430" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <radialGradient id="core" cx="0.5" cy="0.42" r="0.7">
          <stop offset="0" stop-color="#0e4756" />
          <stop offset="1" stop-color="#05141c" />
        </radialGradient>
      </defs>
      <g stroke="#2a6d85" stroke-width="1.1" opacity="0.65">
        <path d="M100 100L172 52" />
        <path d="M100 100L180 132" />
        <path d="M100 100L124 178" />
        <path d="M100 100L42 168" />
        <path d="M100 100L26 76" />
      </g>
      <ellipse cx="100" cy="132" rx="86" ry="26" fill="none" stroke="#22d3ee" stroke-width="1" opacity="0.28" />
      <ellipse cx="100" cy="132" rx="60" ry="18" fill="none" stroke="#38bdf8" stroke-width="0.9" opacity="0.2" />
      <path
        d="M100 30l44 25.4v50.8L100 157.6 56 106.2V55.4L100 30z"
        fill="none"
        stroke="#22d3ee"
        stroke-width="1.6"
        opacity="0.5"
      />
      <path
        d="M100 62l26 15v30l-26 15-26-15V77l26-15z"
        fill="url(#core)"
        stroke="#67e8f9"
        stroke-width="2"
        stroke-linejoin="round"
      />
      <circle cx="100" cy="30" r="5" fill="#ff6b6b" />
      <circle cx="172" cy="52" r="4.4" fill="#22d3ee" />
      <circle cx="180" cy="132" r="4.4" fill="#f5a524" />
      <circle cx="124" cy="178" r="4.4" fill="#4ade80" />
      <circle cx="42" cy="168" r="4.4" fill="#a78bfa" />
      <circle cx="26" cy="76" r="4.4" fill="#2dd4bf" />
    </svg>

    <div class="content">
      <p class="eyebrow">HL7 FHIR · Interactive Handbook</p>
      <h1>FHIR</h1>
      <p class="subtitle">3D 互動式教學手冊</p>
      <div class="rule"></div>
      <p class="lede">
        旋轉 3D 場景、點亮 Resource 節點，<br />
        在終端機送出真實形態的 FHIR 請求。
      </p>
      <div class="chips">
        <span class="chip">Resource</span>
        <span class="chip">REST API</span>
        <span class="chip">認證考試</span>
        <span class="chip">Conformance Testing</span>
      </div>
      <p class="url">fhir.gh.miniasp.com · R4 / R4B / R5</p>
    </div>
  </body>
</html>
